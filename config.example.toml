# Local Whisper stays local. Only clicking Generate highlights sends transcript text to OpenAI.
# Copy this file to config.toml. The actual config.toml is excluded from Git.
[llm]
api_key = "" # Paste your OpenAI API key here, or set OPENAI_API_KEY in the server environment.
model = "gpt-5.6-terra" # Must support the Responses API and Structured Outputs.
timeout_seconds = 180
max_input_chars = 32000 # Long transcripts are analyzed in overlapping windows, then ranked globally.

[highlights]
max_count = 5
min_seconds = 20
max_seconds = 90
objective = "Select the most useful insights, memorable stories, and actionable takeaways for social media. Each passage should make sense on its own and communicate a complete idea."
